[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openfront-ai"
version = "0.1.0"
description = "Local OpenFront neural branch ranking and accelerated surrogate self-play"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "torch>=2.2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
openfront-ai = "openfront_ai.cli:main"

[tool.setuptools.packages.find]
include = ["openfront_ai*"]

[tool.setuptools.package-data]
openfront_ai = ["replay.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["engine: integration with the optional pinned OpenFront headless engine"]
